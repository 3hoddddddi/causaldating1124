<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Romanceast - Online Dating</title>
    
    <!-- 1. Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- 2. Tailwind CSS CDN (替代原本丢失的CSS文件) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                        playfair: ['Playfair Display', 'serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- 3. 自定义 CSS 修复 -->
    <style>
        /* 移动端基础优化 */
        body { -webkit-tap-highlight-color: transparent; }
        
        /* 修复轮播图在没有React的情况下的样式 */
        .profile-card {
            transition: all 0.5s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        
        /* 简单的堆叠效果 */
        .card-stack { position: relative; height: 350px; width: 100%; display: flex; justify-content: center; align-items: center; }
        .card-1 { z-index: 30; transform: scale(1.1); animation: float 6s ease-in-out infinite; }
        .card-2 { z-index: 20; transform: translateX(-60px) scale(0.9) rotate(-10deg); opacity: 0.8; filter: blur(1px); position: absolute; }
        .card-3 { z-index: 20; transform: translateX(60px) scale(0.9) rotate(10deg); opacity: 0.8; filter: blur(1px); position: absolute; }
    </style>
</head>

<body class="min-h-screen bg-[#F6F7F8] flex flex-col font-poppins text-[#1F2D2E]">

    <!-- 顶部导航 -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-100 h-16 flex items-center justify-between px-4 shadow-sm">
        <div class="w-10"></div> <!-- 占位符 -->
        <div class="flex-1 flex justify-center">
            <!-- Logo: 注意，如果这个链接失效，你需要下载这个svg图片放到 assets 文件夹里 -->
            <img src="https://romanceast.com/land-static/svg/logos/black/romanceast.svg" alt="Romanceast" class="h-6 object-contain">
        </div>
        <button class="p-2 hover:bg-gray-100 rounded-full transition-colors" aria-label="Menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M4 12h16"></path><path d="M4 18h16"></path><path d="M4 6h16"></path></svg>
        </button>
    </header>

    <!-- 主内容区 -->
    <main class="flex-1 pt-20 pb-10 overflow-x-hidden">
        
        <!-- Hero 标题 -->
        <div class="text-center px-4 mt-8 mb-6 max-w-2xl mx-auto animate-fade-in-up">
            <h1 class="font-semibold text-2xl md:text-4xl mb-4 leading-tight">
                Nutze deine Chance auf ein <span class="text-[#ea4c89]">qualitativ hochwertiges</span> Match
            </h1>
            <p class="text-gray-500 text-sm md:text-lg leading-relaxed max-w-xs mx-auto md:max-w-lg">
                Fülle kurz den Fragebogen aus und starte mit dem Online-Dating, wie es dir gefällt.
            </p>
        </div>

        <!-- 个人资料卡片展示 (修复版) -->
        <div class="w-full py-4 overflow-hidden animate-fade-in-up" style="animation-delay: 0.2s;">
            <div class="card-stack">
                <!-- 左卡片 -->
                <div class="profile-card card-2 w-32 h-44 rounded-2xl border-4 border-white overflow-hidden bg-gray-200">
                    <img src="https://i.gstatvb.com/fc0a4f65002a32153a0e829f960f5d3f1753962528.rng.webp" class="w-full h-full object-cover">
                </div>
                <!-- 中间主卡片 -->
                <div class="profile-card card-1 w-48 h-64 rounded-2xl border-4 border-white overflow-hidden bg-gray-200 shadow-2xl">
                    <img src="https://i.gstatvb.com/51e374c607fd9ce468cad39b242dc8f11753962528.rng.webp" class="w-full h-full object-cover">
                    <div class="absolute top-1/2 right-2 -translate-y-1/2 w-4 h-4 bg-[#2ECC71] rounded-full border-2 border-white shadow-sm z-10"></div>
                </div>
                <!-- 右卡片 -->
                <div class="profile-card card-3 w-32 h-44 rounded-2xl border-4 border-white overflow-hidden bg-gray-200">
                    <img src="https://i.gstatvb.com/c1e63704a94bfd2f12cf8a2f122bbd901753962529.rng.webp" class="w-full h-full object-cover">
                </div>
            </div>
        </div>

        <!-- 性别选择按钮 -->
        <div class="max-w-md mx-auto px-4 py-8 animate-fade-in-up" style="animation-delay: 0.4s;">
            <h3 class="text-center font-bold text-[#FF4036] mb-6 tracking-wide uppercase text-xs md:text-sm">
                Wähle dein Geschlecht
            </h3>
            <div class="flex gap-4 justify-center">
                <!-- 按钮：男 -->
                <button onclick="selectGender('male')" class="flex-1 bg-white rounded-2xl shadow-sm border border-transparent p-6 flex flex-col items-center gap-3 hover:shadow-lg hover:border-[#FF4036] hover:-translate-y-1 transition-all duration-300 group">
                    <span class="text-4xl group-hover:scale-110 transition-transform">👨</span>
                    <span class="font-semibold text-gray-800">Mann</span>
                </button>
                <!-- 按钮：女 -->
                <button onclick="selectGender('female')" class="flex-1 bg-white rounded-2xl shadow-sm border border-transparent p-6 flex flex-col items-center gap-3 hover:shadow-lg hover:border-[#FF4036] hover:-translate-y-1 transition-all duration-300 group">
                    <span class="text-4xl group-hover:scale-110 transition-transform">👩</span>
                    <span class="font-semibold text-gray-800">Frau</span>
                </button>
            </div>
        </div>

    </main>

    <!-- 底部 Footer -->
    <footer class="bg-gray-50 py-8 border-t border-gray-200 mt-auto">
        <div class="max-w-4xl mx-auto px-4 text-center">
            <div class="flex flex-wrap justify-center gap-2 mb-6 text-xs text-gray-400">
                <a href="#" class="hover:text-gray-800">Nutzungsbedingungen</a>
                <span>•</span>
                <a href="#" class="hover:text-gray-800">Datenschutzrichtlinie</a>
                <span>•</span>
                <a href="#" class="hover:text-gray-800">Cookie-Richtlinie</a>
                <span>•</span>
                <a href="#" class="hover:text-gray-800">Impressum</a>
            </div>
            <div class="text-xs text-gray-400 mb-4">
                © 2025 Romanceast. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- 简单的交互脚本 -->
    <script>
        function selectGender(gender) {
            // 这里你可以修改点击后的跳转逻辑
            alert('你选择了: ' + (gender === 'male' ? 'Mann' : 'Frau'));
            // 例如跳转： window.location.href = "https://your-next-page.com";
        }
    </script>

</body>
</html>
